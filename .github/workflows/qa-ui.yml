name: Auditoria visual de interface — desktop e celular

on:
  pull_request:
    paths:
      - 'caderno.*'
      - 'site-version.js'
      - 'tests/**'
      - '.github/workflows/qa-ui.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/qa-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegadores de teste
        run: |
          pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Servir site local para auditoria
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/psicomoodle-qa-http.log 2>&1 &
          sleep 3
      - name: Auditar três semestres em Chromium desktop, Android e WebKit iPhone
        run: python tests/ui-smoke.py
      - name: Percorrer tutorial e verificar estabilidade visual no Safari iPhone e Android
        if: ${{ !cancelled() }}
        run: python tests/tutorial-mobile-smoke.py
      - name: Verificar cartões de PDF em iPhone e Android (320px e 390px)
        if: ${{ !cancelled() }}
        run: python tests/material-card-smoke.py
      - name: Verificar carregamento tardio do acervo e cartões de largura inteira
        if: ${{ !cancelled() }}
        run: python tests/library-load-smoke.py
      - name: Verificar entrada limpa da IA Tzoul em iPhone e Android
        if: ${{ !cancelled() }}
        run: python tests/ai-mobile-composer-smoke.py
      - name: Verificar cliques do Admin Config com registros fictícios
        if: ${{ !cancelled() }}
        run: python tests/admin-log-smoke.py
      - name: Publicar evidências da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual-screenshots
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
