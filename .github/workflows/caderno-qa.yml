name: Testar Caderno sem publicar
on:
  pull_request:
    paths:
      - 'caderno.*'
      - 'site-version.js'
      - 'tests/**'
      - '.github/workflows/caderno-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar a versão do Caderno e regressões existentes
        run: node --test tests/site-qa.test.mjs tests/caderno-v2.test.mjs
