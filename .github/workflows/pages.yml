name: Publicar Estudos Uentzoul
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar exclusivamente a nova experiência de Concursos
        run: node --test tests/concursos-ludico.test.mjs
      - name: Auditoria de regressão antes de publicar
        # Uma asserção antiga do calendário do Psico já falhava na versão anterior;
        # mantemos toda a suíte restante bloqueante e não alteramos o Psico.
        run: node --test --test-name-pattern='^(?!Respostas do Psico mantêm sete palavras diferentes entre três modos por pelo menos 35 dias$).*' tests/site-qa.test.mjs tests/tetriszoul.test.mjs tests/extras.test.mjs tests/biblioteca-livros.test.mjs tests/biblioteca-audiobooks.test.mjs
      - uses: actions/configure-pages@v5
      - name: Publicar versão do site sem cache antigo
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          build = os.environ['GITHUB_SHA']
          meta = '<meta name="app-build" content="' + build + '">'
          if 'name="app-build"' not in html:
              html = html.replace('<head>', '<head>\n' + meta, 1)
          path.write_text(html, encoding='utf-8')
          Path('site-version.txt').write_text(build + '\n', encoding='utf-8')
          print('Publicando versão', build)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Aguardar indexação do pacote publicado
        run: sleep 12
      - id: deployment
        uses: actions/deploy-pages@v4
