name: Publicar Estudos Uentzoul
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar exclusivamente a nova experiência de Concursos
        run: node --test tests/concursos-ludico.test.mjs
      - name: Auditoria de regressão antes de publicar
        # Uma asserção antiga do calendário do Psico já falhava na versão anterior;
        # mantemos toda a suíte restante bloqueante e não alteramos o Psico.
        run: node --test --test-skip-pattern='Respostas do Psico mantêm sete palavras diferentes entre três modos por pelo menos 35 dias' tests/site-qa.test.mjs tests/tetriszoul.test.mjs tests/extras.test.mjs tests/biblioteca-livros.test.mjs tests/biblioteca-audiobooks.test.mjs
      - uses: actions/configure-pages@v5
      - name: Publicar versão do site sem cache antigo
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          build = os.environ['GITHUB_SHA']
          meta = '<meta name="app-build" content="' + build + '">'
          if 'name="app-build"' not in html:
              html = html.replace('<head>', '<head>\n' + meta, 1)
          import re
          # Atualizar a URL do painel administrativo a cada publicação.
          html, admin_scripts = re.subn(
              r'(src=["\x27](?:\./)?admin-config\.js)(?:\?[^"\x27]*)?(?=["\x27])',
              lambda match: match.group(1) + '?v=' + build,
              html
          )
          # As URLs dos materiais mudam apenas em novos carregamentos, sem recarregar sessões abertas.
          html = re.sub(
              r'(src=["\x27](?:\./)?(?:simulados-finais-2026|estudo-ativo|estudos-dirigidos-finais-2026)\.js)(?:\?[^"\x27]*)?(?=["\x27])',
              lambda match: match.group(1) + '?v=' + build,
              html
          )
          if not admin_scripts:
              print('Aviso: referência direta ao painel não encontrada no HTML')
          # Versiona toda a cadeia de iframes do Extras com o SHA publicado.
          # Uma atualização do jogo nunca reutiliza a URL de um build anterior.
          extras_asset = re.compile(
              r'((?:\./)?(?:extras\.html|extras\.js|extras\.css|tetriszoul\.html|tetriszoul-theme\.css))(?:\?v=[A-Za-z0-9_-]+)?(?=["\x27])'
          )
          def version_extras(source):
              return extras_asset.sub(lambda match: match.group(1) + '?v=' + build, source)
          html = version_extras(html)
          for name in ('extras.html', 'extras.js', 'tetriszoul.html', 'site-version.js'):
              asset = Path(name)
              source = asset.read_text(encoding='utf-8')
              updated = version_extras(source)
              if source != updated:
                  asset.write_text(updated, encoding='utf-8')
          path.write_text(html, encoding='utf-8')
          Path('site-version.txt').write_text(build + '\n', encoding='utf-8')
          print('Publicando versão', build)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Aguardar indexação do pacote publicado
        run: sleep 12
      - id: deployment
        uses: actions/deploy-pages@v4
