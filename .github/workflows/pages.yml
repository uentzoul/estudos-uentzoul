name: Publicar Estudos Uentzoul
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Publicar versão do site sem cache antigo
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          build = os.environ['GITHUB_SHA']
          meta = '<meta name="app-build" content="' + build + '">'
          if 'name="app-build"' not in html:
              html = html.replace('<head>', '<head>\n' + meta, 1)
          path.write_text(html, encoding='utf-8')
          Path('site-version.txt').write_text(build + '\n', encoding='utf-8')
          print('Publicando versão', build)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Aguardar indexação do pacote publicado
        run: sleep 12
      - id: deployment
        uses: actions/deploy-pages@v4
