name: Testes de estabilidade das chamadas

on:
  push:
    branches: [main]
    paths:
      - 'group-call.js'
      - 'tests/group-call-*.test.mjs'
      - 'tests/group-call-e2e.mjs'
      - 'tests/group-call-turn-probe.mjs'
      - '.github/workflows/call-stability.yml'
  pull_request:
    paths:
      - 'group-call.js'
      - 'tests/group-call-*.test.mjs'
      - 'tests/group-call-e2e.mjs'
      - 'tests/group-call-turn-probe.mjs'
      - '.github/workflows/call-stability.yml'
  workflow_dispatch:

concurrency:
  group: call-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar-webrtc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do módulo de chamada
        run: node --check group-call.js
      - name: Verificar recuperação de negociação, mídia e presença
        run: node --test tests/group-call-stability.test.mjs tests/group-call-signaling.test.mjs

  webrtc-real:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador real para teste entre dois participantes
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
      - name: Testar câmera e compartilhamento de tela WebRTC entre duas abas
        run: node tests/group-call-e2e.mjs

  webrtc-turn-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chrome e Playwright
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Testar relay TURN via rede externa com ICE relay-only
        run: node tests/group-call-turn-probe.mjs
