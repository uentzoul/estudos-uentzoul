name: Testes de estabilidade das chamadas

on:
  push:
    branches: [main]
    paths:
      - 'group-call.js'
      - 'supabase/functions/call-ice/**'
      - 'tests/group-call-*.test.mjs'
      - 'tests/group-call-e2e.mjs'
      - '.github/workflows/call-stability.yml'
  pull_request:
    paths:
      - 'group-call.js'
      - 'supabase/functions/call-ice/**'
      - 'tests/group-call-*.test.mjs'
      - 'tests/group-call-e2e.mjs'
      - '.github/workflows/call-stability.yml'
  workflow_dispatch:

concurrency:
  group: call-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar-webrtc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do módulo de chamada
        run: node --check group-call.js
      - name: Verificar recuperação de negociação, mídia e presença
        run: node --test tests/group-call-stability.test.mjs tests/group-call-signaling.test.mjs tests/group-call-turn.test.mjs

  webrtc-real:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador real para teste entre dois participantes
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
      - name: Testar câmera e compartilhamento de tela WebRTC entre duas abas
        run: node tests/group-call-e2e.mjs

  verificar-funcao-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Conferir sintaxe e tipos da função TURN protegida
        run: deno check supabase/functions/call-ice/index.ts
