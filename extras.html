<!doctype html>
<html lang="pt-BR" class="extras-booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f1fa">
<script>
try{
 if(window.parent!==window&&window.parent.location.origin===location.origin){
  const theme=window.parent.document.documentElement.dataset.theme;
  if(theme==="dark"||theme==="light")document.documentElement.dataset.theme=theme;
 }
}catch(_){}
// Se os scripts externos falharem, mostrar uma mensagem em vez de uma tela vazia.
setTimeout(()=>{
 if(!document.documentElement.classList.contains('extras-booting'))return;
 document.documentElement.classList.remove('extras-booting');
 const status=document.getElementById('extrasGateStatus');
 if(status)status.textContent='Não foi possível carregar os jogos. Abre Extras novamente pelo PsicoMoodle.';
},6500);
</script>
<title>Extras · PsicoMoodle</title>
<link rel="stylesheet" href="./extras.css?v=20261120-auth-fix-v4">
</head>
<body>
<main class="extras-wrap">
 <section id="extrasGate" class="extras-gate" role="status">
  <div class="gate-symbol">✦</div>
  <h1>Extras</h1>
  <p id="extrasGateStatus">Conferindo tua sessão…</p>
  <a href="./index.html#home">Voltar ao PsicoMoodle</a>
 </section>
 <section id="extrasApp" hidden>
  <header class="extras-hero">
   <div class="eyebrow"><span class="live-dot"></span> Jogos</div>
   <div class="hero-row">
    <div><h1>Extras</h1></div>
    <div class="today-pill"><span>DESAFIO SELECIONADO</span><strong id="dayLabel">—</strong></div>
   </div>
  </header>
  <nav class="extras-tabs" aria-label="Jogos extras" role="tablist">
   <button role="tab" type="button" data-game="psico" aria-selected="true"><span class="tab-glyph" aria-hidden="true">▣</span><span><strong>PSICO</strong><small>Cinco letras</small></span></button>
   <button role="tab" type="button" data-game="contexto" aria-selected="false"><span class="tab-glyph" aria-hidden="true">◎</span><span><strong>CONTEXTO</strong><small>Proximidade semântica</small></span></button>
   <button role="tab" type="button" data-game="conexo" aria-selected="false"><span class="tab-glyph" aria-hidden="true">◈</span><span><strong>VÍNCULO</strong><small>Quatro conexões</small></span></button>
   <button role="tab" type="button" data-game="tetris" aria-selected="false" hidden><span class="tab-glyph" aria-hidden="true">▦</span><span><strong>Tetris</strong><small>TetrisZoul · 40 linhas</small></span></button>
  </nav>
  <div id="extrasCalendar" class="extras-calendar">
   <button type="button" id="calendarToggle" class="calendar-toggle" aria-haspopup="dialog" aria-expanded="false" aria-controls="calendarPopup">
    <span class="calendar-toggle-icon" aria-hidden="true">▦</span><span>Calendário</span><small id="calendarSelectedLabel">—</small><span class="calendar-chevron" aria-hidden="true">⌄</span>
   </button>
   <div id="calendarPopup" class="calendar-popup" role="dialog" aria-label="Escolher o dia do desafio" hidden>
    <div class="calendar-popup-header">
     <button type="button" id="calendarMonthPrev" class="calendar-month-arrow" aria-label="Mês anterior">‹</button>
     <strong id="calendarMonthLabel">—</strong>
     <button type="button" id="calendarMonthNext" class="calendar-month-arrow" aria-label="Mês seguinte">›</button>
    </div>
    <div class="calendar-weekdays" aria-hidden="true"><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span></div>
    <div id="calendarDays" class="calendar-days" role="grid" aria-label="Datas disponíveis"></div>
    <div class="calendar-popup-footer"><button type="button" id="archiveToday" class="calendar-today">Hoje</button></div>
   </div>
  </div>
  <section id="gameHost" role="tabpanel" aria-live="polite" aria-label="Jogo selecionado"></section>
 </section>
</main>
<script src="./extras-data.js?v=20261120-update-2"></script>
<script src="./extras.js?v=20261120-softdrop-v6"></script>
</body>
</html>
